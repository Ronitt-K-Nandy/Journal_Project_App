# When you have multiple profiles, you can specify which one is active using the following property.
spring.profiles.active=dev

# When you have multiple profiles, you can specify together which ones are active using the following property.
#spring.profiles.active=dev,prod

# You can also delete this file, and mention the profile in dialog box that appears after clicking
# 'Edit Configurations' from main application file (JournalApplication.java) beside 'Run' button above.
# There you will find an attribute 'Active profiles' where you can mention only 'dev' or 'prod'
# or there will be attribute called 'Environement variables' where you have to mention 'spring.profiles.active=dev'
# or 'spring.profiles.active=prod' depending on which profile you want to activate.

# If you delete the file(application.properties), and try to run jar using command line, you can mention the profile using the following command:
# mvn clean package and then, java -jar .\newspaper_journal.jar --spring.profiles.active=dev
#or
# mvn clean package -Dspring.profiles.active=dev and then, java -jar .\newspaper_journal.jar

# to print logger.debug or log.debug mention it like this, because in normal 'Run' it does not print.
# It means under 'Journal', DEBUG and more severity messsages will be printed.
# Severity :- TRACE < DEBUG < INFO < WARN < ERROR < FATAL
logging.level.net.Journal.JournalApplication=DEBUG